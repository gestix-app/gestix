name: Lighten site background v2

on:
  push:
    paths:
      - 'trigger-light-bg.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lighten global background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '--bg:#06101d;--card:#0a1b2d;': '--bg:#0b1a2d;--card:#0d2034;',
            'background:linear-gradient(180deg,#06101d,#071425 45%,#06111f)': 'background:linear-gradient(180deg,#0b1a2d,#10243a 45%,#0c1d31)',
            'header{position:sticky;top:0;z-index:50;background:#06101de8;': 'header{position:sticky;top:0;z-index:50;background:#0b1a2de8;',
            '.integrations{background:linear-gradient(180deg,#06101d,#071425 50%,#06111f);': '.integrations{background:linear-gradient(180deg,#0b1a2d,#10243a 50%,#0c1d31);',
            '.strip{border-block:1px solid #ffffff0f;background:#091524}': '.strip{border-block:1px solid #ffffff14;background:#0d2034}',
            'footer{border-top:1px solid #1b2d44;background:#050d18}': 'footer{border-top:1px solid #24405d;background:#081626}'
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s)
          PY
          git config user.name 'Gestix'
          git config user.email 'fullphoneok@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use a lighter overall site background'
          git push
