name: Fix logos after integrations design

on:
  workflow_run:
    workflows: ["Apply integrations visual design"]
    types: [completed]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make logos visible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.integration-brand-card .brandmark img{filter:brightness(0) invert(1)!important}'
          if marker not in s:
              css = '''<style id="gestix-logo-visibility-fix">
          .integration-brand-card:first-child .brandmark img,
          .integration-brand-card:nth-child(2) .brandmark img,
          .integration-brand-card:nth-child(5) .brandmark img{filter:brightness(0) invert(1)!important;background:transparent!important;padding:0!important;border-radius:0!important}
          .integration-brand-card:nth-child(4) .brandmark img{background:transparent!important;padding:0!important;border-radius:0!important;mix-blend-mode:darken!important}
          .integration-brand-card:nth-child(6) .brandmark img{filter:brightness(0) saturate(100%) invert(82%) sepia(98%) saturate(1000%) hue-rotate(5deg) brightness(105%) contrast(105%)!important;background:transparent!important;padding:0!important;border-radius:0!important}
          .integration-brand-card .brandmark{height:145px!important}
          .integration-brand-card .brandmark img{max-width:320px!important;max-height:120px!important}
          .integration-brand-card{min-height:330px!important}
          @media(max-width:620px){.integration-brand-card{min-height:250px!important}.integration-brand-card .brandmark{height:82px!important}.integration-brand-card .brandmark img{max-width:155px!important;max-height:70px!important}}
          </style>'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: restore visible integration logos' && git push)
