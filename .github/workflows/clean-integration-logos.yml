name: Clean integration logos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken logo assets
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('assets/logos/arca.png','https://upload.wikimedia.org/wikipedia/commons/a/a3/ARCA_logo.png'); s=s.replace('assets/logos/correo-argentino.png','https://upload.wikimedia.org/wikipedia/commons/a/ad/Correo_Argentino_Logo.svg'); s=s.replace('assets/logos/tiendanube.png','https://upload.wikimedia.org/wikipedia/commons/7/78/Logo_de_Tiendanube.svg'); s=s.replace('assets/logos/mercado-libre.png','https://upload.wikimedia.org/wikipedia/commons/6/60/Mercado_Libre_wordmark_%28Spanish_version%29.svg'); s=s.replace('.integration-brand-card:nth-child(4) .brandmark img{mix-blend-mode:screen!important;filter:invert(1) hue-rotate(180deg)!important}',''); s=s.replace('.integration-brand-card:nth-child(5) .brandmark img{background:#fff!important;padding:12px 20px!important;border-radius:14px!important;filter:none!important;max-width:210px!important;max-height:76px!important}',''); s=s.replace('.ml-integration .brandmark img{width:260px!important;max-width:260px!important;max-height:100px!important;object-fit:contain!important;filter:brightness(1.45) saturate(1.15) drop-shadow(0 8px 18px #0008)!important;transform:scale(1.12)}','.ml-integration .brandmark img{width:250px!important;max-width:250px!important;max-height:100px!important;object-fit:contain!important;filter:none!important;transform:none!important}'); s=s.replace('.ml-card .ml-visual img{width:300px!important;max-width:100%!important;max-height:150px!important;object-fit:contain!important;background:transparent!important;padding:0!important;border-radius:0!important}','.ml-card .ml-visual img{width:260px!important;max-width:100%!important;max-height:120px!important;object-fit:contain!important;background:transparent!important;padding:0!important;border-radius:0!important;filter:none!important}'); p.write_text(s)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: use clean integration logo assets"
          git push
