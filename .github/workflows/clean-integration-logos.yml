name: Clean integration logos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clean logo CSS and references
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('assets/logos/correo-argentino.webp','assets/logos/correo-argentino.png'); s=s.replace('.integration-brand-card:first-child .brandmark img{filter:brightness(0) invert(1)}',''); s=s.replace('.integration-brand-card:nth-child(2) .brandmark img{filter:brightness(0) invert(1)}',''); s=s.replace('.integration-brand-card:nth-child(4) .brandmark img{mix-blend-mode:screen;filter:invert(1) hue-rotate(180deg)}',''); s=s.replace('.ml-visual img{width:min(300px,100%);max-height:160px;object-fit:contain;background:#fff;border-radius:16px;padding:10px 18px;filter:drop-shadow(0 15px 25px #0007)}','.ml-visual img{width:min(300px,100%);max-height:160px;object-fit:contain;background:transparent;border-radius:0;padding:0;filter:none}'); s=s.replace('.integration-brand-card{min-height:280px;padding:28px 20px 21px}', '.integration-brand-card{min-height:300px;padding:28px 22px 24px}'); s=s.replace('.brandmark{height:104px;', '.brandmark{height:120px;'); s=s.replace('.brandmark img{max-width:225px;max-height:92px;', '.brandmark img{max-width:250px;max-height:100px;'); p.write_text(s)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: clean integration logos"
          git push
