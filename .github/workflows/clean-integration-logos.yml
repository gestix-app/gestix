name: Clean integration logos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final integration logo styling
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('https://upload.wikimedia.org/wikipedia/commons/a/a3/ARCA_logo.png','assets/logos/arca-white.svg'); s=s.replace('https://upload.wikimedia.org/wikipedia/commons/a/ad/Correo_Argentino_Logo.svg','assets/logos/correo-argentino-white.svg'); s=s.replace('https://upload.wikimedia.org/wikipedia/commons/7/78/Logo_de_Tiendanube.svg','assets/logos/tiendanube-white.svg'); s=s.replace('https://upload.wikimedia.org/wikipedia/commons/6/60/Mercado_Libre_wordmark_%28Spanish_version%29.svg','assets/logos/mercado-libre-white.svg'); s=s.replace('.ml-integration .brandmark img{width:250px!important;max-width:250px!important;max-height:100px!important;object-fit:contain!important;filter:none!important;transform:none!important}','.ml-integration .brandmark img{width:250px!important;max-width:250px!important;max-height:100px!important;object-fit:contain!important;filter:none!important;transform:none!important}'); p.write_text(s)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; else git commit -m 'fix: finalize visible integration logos'; git push; fi
