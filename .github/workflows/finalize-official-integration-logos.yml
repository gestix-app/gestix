name: Finalize official integration logos

on:
  workflow_run:
    workflows: ["Fix logos after integrations design"]
    types: [completed]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Replace integration logo sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://upload.wikimedia.org/wikipedia/commons/b/b8/Logo_de_Andreani.jpg': 'https://www.redhat.com/cms/managed-files/Andreani-isologo-vector.svg?itok=ouJTRA1g',
              'https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_Tiendanube_2025.svg': 'https://upload.wikimedia.org/wikipedia/commons/7/78/Logo_de_Tiendanube.svg',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: use transparent official integration logos"
          git push
