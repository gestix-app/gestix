name: Lighten site background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lighten-site-background.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Lighten global background
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const branch = context.payload.ref?.replace('refs/heads/', '') || 'main';
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const current = Buffer.from(data.content, 'base64').toString('utf8');
            let next = current;
            next = next.replace('--bg:#06101d;--card:#0a1b2d;', '--bg:#0b1a2d;--card:#0d2034;');
            next = next.replace('background:linear-gradient(180deg,#06101d,#071425 45%,#06111f)', 'background:linear-gradient(180deg,#0b1a2d,#10243a 45%,#0c1d31)');
            next = next.replace('header{position:sticky;top:0;z-index:50;background:#06101de8;', 'header{position:sticky;top:0;z-index:50;background:#0b1a2de8;');
            next = next.replace('.integrations{background:linear-gradient(180deg,#06101d,#071425 50%,#06111f);', '.integrations{background:linear-gradient(180deg,#0b1a2d,#10243a 50%,#0c1d31);');
            next = next.replace('.strip{border-block:1px solid #ffffff0f;background:#091524}', '.strip{border-block:1px solid #ffffff14;background:#0d2034}');
            next = next.replace('footer{border-top:1px solid #1b2d44;background:#050d18}', 'footer{border-top:1px solid #24405d;background:#081626}');
            if (next === current) core.setFailed('No expected background styles were found; refusing to make a blind change.');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'fix: use a lighter overall site background',
              content: Buffer.from(next, 'utf8').toString('base64'),
              sha: data.sha
            });
