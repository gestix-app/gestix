name: Apply integration logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace integration initials with real logos
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              '<div class="brandmark">TN</div>': '<div class="brandmark logo-mark"><img src="https://raw.githubusercontent.com/Aerolab/silicon-baires/main/assets/logos/tiendanube.svg" alt="Tienda Nube"></div>',
              '<div class="brandmark">OCA</div>': '<div class="brandmark logo-mark"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/OCA_logo.svg" alt="OCA"></div>',
              '<div class="brandmark">A</div>': '<div class="brandmark logo-mark"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo_de_Andreani.jpg" alt="Andreani"></div>',
              '<div class="brandmark">CA</div>': '<div class="brandmark logo-mark"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo_Correo_Argentino.svg" alt="Correo Argentino"></div>',
              '<div class="brandmark">MP</div>': '<div class="brandmark logo-mark"><img src="https://cdn.simpleicons.org/mercadopago/00B1EA" alt="Mercado Pago"></div>',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          css = '.integration .brandmark.logo-mark{height:52px;padding:0 8px}.integration .brandmark.logo-mark img{max-width:145px;max-height:42px;width:auto;height:auto;object-fit:contain;display:block}'
          if '.integration .brandmark.logo-mark{' not in s:
              s = s.replace('.integration small{', css + '.integration small{', 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "Gestix"
          git config user.email "fullphoneok@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Usar logos reales en integraciones"
            git push
          fi
