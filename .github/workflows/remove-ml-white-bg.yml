name: Remove Mercado Libre white background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const p = 'index.html';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: p, ref: context.ref.replace('refs/heads/','')});
            const text = Buffer.from(data.content, 'base64').toString('utf8');
            const fixed = text.replace('.brandmark:before{content:"";position:absolute;inset:8px 10px;border-radius:14px;background:#fff;box-shadow:0 10px 28px #0000002e}', '').replace('background:#fff!important;padding:16px 22px!important;border-radius:16px!important', 'background:transparent!important;padding:0!important;border-radius:0!important');
            if (fixed !== text) {
              await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path: p, message: 'fix: remove white backgrounds from Mercado Libre logos', content: Buffer.from(fixed).toString('base64'), sha: data.sha, branch: context.ref.replace('refs/heads/','')});
            }
