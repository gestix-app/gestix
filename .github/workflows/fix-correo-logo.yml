name: Fix Correo Argentino logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Correo Argentino logo on landing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace Correo Argentino logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://www.google.com/s2/favicons?domain=correoargentino.com.ar&sz=128'
          new = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo_Correo_Argentino.svg'
          if old not in s:
              raise SystemExit('old logo URL not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Correo Argentino logo on landing'
          git push