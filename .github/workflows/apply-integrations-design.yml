name: Apply integrations visual design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'apply integrations visual design')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update integrations section
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Match the integrations grid and the Premium Mercado Libre card.
          grid_re = re.compile(r'<div class="integration-grid">.*?</div></div><p class="integration-note">', re.S)
          replacement = '''<div class="integration-grid">
          <div class="integration integration-brand-card"><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a3/ARCA_logo.png" alt="ARCA"></div><h3>ARCA</h3><small>Facturación electrónica</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          <div class="integration integration-brand-card"><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/a/ad/Correo_Argentino_Logo.svg" alt="Correo Argentino"></div><h3>Correo Argentino</h3><small>Envíos y seguimiento</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          <div class="integration integration-brand-card"><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/OCA_logo.svg" alt="OCA"></div><h3>OCA</h3><small>Envíos y seguimiento</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          <div class="integration integration-brand-card"><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Logo_de_Andreani.jpg" alt="Andreani"></div><h3>Andreani</h3><small>Envíos y seguimiento</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          <div class="integration integration-brand-card"><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_Tiendanube_2025.svg" alt="Tiendanube"></div><h3>Tiendanube</h3><small>E-commerce</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          <div class="integration integration-brand-card ml-integration"><span class="new-badge">NUEVO</span><div class="brandmark"><img src="https://upload.wikimedia.org/wikipedia/commons/6/60/Mercado_Libre_wordmark_%28Spanish_version%29.svg" alt="Mercado Libre"></div><h3>Mercado Libre</h3><small>Publicaciones, pedidos y stock</small><span class="official-badge">✓&nbsp; Integración oficial</span></div>
          </div><p class="integration-note">'''
          if not grid_re.search(s):
              raise SystemExit('integration grid pattern not found')
          s = grid_re.sub(replacement, s, count=1)

          # Replace the existing Premium ML card with the screenshot-style hero card.
          ml_re = re.compile(r'<div class="ml-card">.*?</div></div><p class="integration-note">', re.S)
          ml = '''<div class="ml-card">
          <div class="ml-copy"><div class="ml-badge">NUEVO · PLAN PREMIUM</div><h3>Mercado Libre + Gestix</h3><p>Sincronizá tus publicaciones, recibí pedidos, actualizá el stock en tiempo real y generá las ventas automáticamente en Gestix.</p><div class="ml-list"><span>✓ Sincronización de publicaciones</span><span>✓ Recepción automática de pedidos</span><span>✓ Descuento de stock en tiempo real</span><span>✓ Generación de ventas en Gestix</span></div></div>
          <div class="ml-visual"><img src="https://upload.wikimedia.org/wikipedia/commons/6/60/Mercado_Libre_wordmark_%28Spanish_version%29.svg" alt="Mercado Libre"></div>
          </div><p class="integration-note">'''
          if not ml_re.search(s):
              raise SystemExit('ML card pattern not found')
          s = ml_re.sub(ml, s, count=1)

          # Exact visual treatment inspired by the supplied reference image.
          css = '''<style>
          .integrations{background:linear-gradient(180deg,#06101d 0%,#071425 50%,#06111f 100%);position:relative;overflow:hidden}
          .integrations .heading{max-width:820px;margin-bottom:38px}
          .integrations .heading:before{content:"CONECTÁ TU NEGOCIO";display:inline-flex;align-items:center;justify-content:center;padding:6px 24px;border:1px solid #28bdf2;border-radius:999px;color:#42d1f7;font-size:11px;font-weight:900;letter-spacing:.05em;margin-bottom:18px;background:#0a274044}
          .integrations .heading h2{font-size:clamp(42px,5vw,68px);letter-spacing:-.055em;margin-bottom:13px;background:linear-gradient(90deg,#fff 0%,#fff 38%,#22d4f2 76%);-webkit-background-clip:text;background-clip:text;color:transparent}
          .integrations .heading p{font-size:18px;line-height:1.55;color:#9fb7d3}
          .integration-grid{grid-template-columns:repeat(3,1fr);gap:18px}
          .integration-brand-card{position:relative;min-height:280px;padding:28px 22px 22px;border:1px solid #0c6ca4;background:linear-gradient(145deg,#071827,#091d31);border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-shadow:inset 0 0 0 1px #0b2941;transition:.2s}
          .integration-brand-card:hover{transform:translateY(-4px);border-color:#28bdf2;box-shadow:0 16px 45px #00111f66,inset 0 0 0 1px #123e5b}
          .integration-brand-card .brandmark{width:100%;height:104px;margin:0 0 16px;display:flex;align-items:center;justify-content:center}
          .integration-brand-card .brandmark img{max-width:225px;max-height:92px;width:auto;height:auto;object-fit:contain;border-radius:0}
          .integration-brand-card:first-child .brandmark img{filter:brightness(0) invert(1);max-width:215px}
          .integration-brand-card:nth-child(2) .brandmark img{max-width:230px;max-height:88px}
          .integration-brand-card:nth-child(3) .brandmark img{max-width:220px;max-height:82px}
          .integration-brand-card:nth-child(4) .brandmark img{max-width:235px;max-height:75px;background:#fff;border-radius:9px;padding:10px 18px}
          .integration-brand-card:nth-child(5) .brandmark img{max-width:235px;max-height:78px;background:#fff;border-radius:9px;padding:10px 16px}
          .integration-brand-card:nth-child(6) .brandmark img{max-width:235px;max-height:90px}
          .integration-brand-card h3{font-size:18px;margin:0 0 3px;font-weight:800}
          .integration-brand-card small{font-size:13px;color:#8fb0cf;min-height:21px}
          .official-badge{display:inline-flex;align-items:center;justify-content:center;margin-top:17px;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,#057d77,#0b625f);color:#d8fff6;font-size:11px;font-weight:700;border:1px solid #13b7a8}
          .new-badge{position:absolute;right:13px;top:13px;padding:6px 11px;border:1px solid #268cff;border-radius:999px;background:#0a3974;color:#73c3ff;font-size:10px;font-weight:900}
          .ml-integration{border-color:#1688e4;box-shadow:0 0 0 1px #123b60,inset 0 0 35px #0c4c8d22}
          .ml-card{margin-top:26px;padding:31px;border:1px solid #0e8de9;border-radius:20px;background:radial-gradient(circle at 82% 45%,#1269a533,transparent 42%),linear-gradient(145deg,#0b213a,#081a2d);display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;min-height:300px;overflow:hidden}
          .ml-copy .ml-badge{display:inline-flex;padding:7px 13px;border-radius:999px;background:#0d3565;border:1px solid #398dff;color:#72b5ff;font-size:11px;font-weight:900;margin-bottom:15px}
          .ml-card h3{font-size:clamp(30px,3vw,42px);letter-spacing:-.04em;margin:0 0 9px}
          .ml-card p{margin:0;color:#a7c0db;font-size:16px;line-height:1.55;max-width:700px}
          .ml-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
          .ml-list span{padding:11px 13px;border-radius:10px;background:#071729cc;border:1px solid #17466c;font-size:12px;font-weight:700;color:#d0e0f0}
          .ml-visual{display:flex;align-items:center;justify-content:center;min-height:190px}
          .ml-visual img{width:min(300px,100%);max-height:160px;object-fit:contain;filter:drop-shadow(0 15px 25px #0007)}
          @media(max-width:1000px){.integration-grid{grid-template-columns:repeat(2,1fr)}.ml-card{grid-template-columns:1fr}.ml-visual{order:-1}.ml-visual img{width:260px}}
          @media(max-width:620px){.integrations .heading h2{font-size:42px}.integrations .heading p{font-size:16px}.integration-grid{grid-template-columns:1fr 1fr;gap:14px}.integration-brand-card{min-height:250px;padding:22px 10px 17px}.integration-brand-card .brandmark{height:82px;margin-bottom:12px}.integration-brand-card .brandmark img{max-width:145px;max-height:66px}.integration-brand-card:nth-child(2) .brandmark img{max-width:150px}.integration-brand-card:nth-child(3) .brandmark img{max-width:145px}.integration-brand-card:nth-child(4) .brandmark img{max-width:150px;padding:8px 10px}.integration-brand-card:nth-child(5) .brandmark img{max-width:150px;padding:8px 9px}.integration-brand-card:nth-child(6) .brandmark img{max-width:155px}.integration-brand-card h3{font-size:15px}.integration-brand-card small{font-size:10px;text-align:center;line-height:1.35}.official-badge{font-size:9px;padding:6px 8px;margin-top:12px}.new-badge{font-size:8px;padding:4px 7px;right:8px;top:8px}.ml-card{padding:26px 18px;min-height:0}.ml-card h3{font-size:29px}.ml-card p{font-size:14px}.ml-list{grid-template-columns:1fr;gap:8px}.ml-visual img{width:220px;max-height:125px}}
          </style>'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "apply integrations visual design"
          git push
