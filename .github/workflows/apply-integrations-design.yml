name: Apply integrations design
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'feat: integrations visual final')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final visual CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n.integration-brand-card{min-height:280px;padding:28px 20px 21px;border:1px solid #0c6ca4;background:linear-gradient(145deg,#071827,#091d31);border-radius:19px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:inset 0 0 0 1px #0b2941;transition:.2s}.integration-brand-card .brandmark{height:104px;margin-bottom:15px}.integration-brand-card .brandmark img{max-width:225px;max-height:92px;width:auto;height:auto;object-fit:contain;background:transparent!important;padding:0!important;border-radius:0!important;filter:none!important}.integration-brand-card:first-child .brandmark img{filter:brightness(0) invert(1)!important}.integration-brand-card:nth-child(2) .brandmark img{filter:brightness(0) invert(1)!important}.integration-brand-card:nth-child(4) .brandmark img,.integration-brand-card:nth-child(5) .brandmark img{background:transparent!important;padding:0!important}.ml-integration .brandmark img{max-width:225px;max-height:92px}.ml-card .ml-visual img{width:min(260px,100%);max-height:150px;object-fit:contain;background:transparent!important;padding:0!important;border-radius:0!important;filter:drop-shadow(0 12px 20px #0007)!important}@media(max-width:620px){.integration-brand-card{min-height:250px;padding:22px 10px 17px}.integration-brand-card .brandmark{height:82px;margin-bottom:12px}.integration-brand-card .brandmark img{max-width:155px;max-height:66px}.integration-brand-card:nth-child(2) .brandmark img{max-width:165px}.ml-integration .brandmark img{max-width:155px;max-height:66px}.ml-card .ml-visual img{width:220px;max-height:125px}}\n'''
          marker='</style>'
          if css not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: integrations visual final'
          git push
