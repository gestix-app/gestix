name: Correct integration logos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: correct integration logos v2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Mercado Libre logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://upload.wikimedia.org/wikipedia/commons/d/d4/MercadoLibre_logo.PNG'
          new='https://d1.awsstatic.com/onedam/marketing-channels/website/aws/en_US/industries/approved/images/6ma6fx7c-awsi-retail-mercado.c7ae0f7790305bea37f6f13dc0cdfa040f5cd627.png'
          s=s.replace(old,new)
          old2='https://upload.wikimedia.org/wikipedia/commons/6/60/Mercado_Libre_wordmark_%28Spanish_version%29.svg'
          s=s.replace(old2,new)
          s=s.replace('.ml-visual img{width:min(300px,100%);max-height:160px;object-fit:contain;filter:drop-shadow(0 15px 25px #0007)}', '.ml-visual img{width:min(300px,100%);max-height:160px;object-fit:contain;background:#fff;border-radius:16px;padding:10px 18px;filter:drop-shadow(0 15px 25px #0007)}')
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: correct integration logos v2'
          git push
