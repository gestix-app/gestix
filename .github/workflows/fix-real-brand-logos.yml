name: Fix real brand logos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: real brand logos applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo assets and presentation
        run: |
          sed -i 's#https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_Tiendanube_2025.svg#https://upload.wikimedia.org/wikipedia/commons/7/78/Logo_de_Tiendanube.svg#g' index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
/* Final integration-logo correction */
.integration-brand-card:nth-child(4) .brandmark img{background:transparent!important;padding:0!important;mix-blend-mode:screen;filter:invert(1) hue-rotate(180deg)!important}
.integration-brand-card:nth-child(5) .brandmark img{background:transparent!important;padding:0!important;filter:brightness(0) invert(1)!important}
.ml-integration .brandmark img{width:260px!important;max-width:260px!important;max-height:100px!important;object-fit:contain!important;filter:brightness(1.45) saturate(1.15) drop-shadow(0 8px 18px #0008)!important;transform:scale(1.12)}
.ml-card .ml-visual img{width:300px!important;max-width:100%!important;max-height:150px!important;object-fit:contain!important}
@media(max-width:620px){
  .integration-brand-card:nth-child(4) .brandmark img{max-width:175px!important;max-height:72px!important}
  .integration-brand-card:nth-child(5) .brandmark img{max-width:175px!important;max-height:72px!important}
  .ml-integration .brandmark img{width:220px!important;max-width:220px!important;max-height:90px!important;transform:scale(1.12)}
  .ml-card .ml-visual img{width:270px!important;max-width:100%!important;max-height:140px!important}
}
'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'fix: real brand logos applied' || true
          git push
