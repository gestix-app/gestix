name: Update Gestix plan messaging

on:
  push:
    paths:
      - '.github/workflows/plan-messaging.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update plan messaging
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<article><button>¿El catálogo online está incluido en todos los planes?<span>+</span></button><p>No. El catálogo online es una funcionalidad exclusiva del plan Premium.</p></article>': '<article><button>¿El catálogo online está incluido en todos los planes?<span>+</span></button><p>No. El catálogo online está incluido en los planes Plus y Premium.</p></article>',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git add index.html
          git commit -m 'Fix Gestix catalog plan FAQ'
          git push
